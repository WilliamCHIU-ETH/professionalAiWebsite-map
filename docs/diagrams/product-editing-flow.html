<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業人士 AI 網站：生成到自行維護</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --rule: rgba(45,49,66,0.12); --accent: #eb6c36; --link: #2e5aa8;
      --sans: 'Geist', 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK TC', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 8px; color: var(--muted); font: 500 12px var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; color: var(--ink); font: 400 32px/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 840px; }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 8px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.08em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.12em; }
    .role-text { fill: var(--ink); font-size: 8px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 8px var(--sans); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 8px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.08em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 8px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Product flow · current → next</p>
    <h1>從一次性生成，到醫師能自行維護的 AI-assisted Website CMS</h1>

    <svg viewBox="0 0 840 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="product-editing-flow-title product-editing-flow-desc">

      <desc id="product-editing-flow-desc">公開資料先被抓取並整理成網站資料，再由固定模板生成初版；下一階段讓醫師透過對話或視覺操作提出修改，由系統驗證、保留版本，最後預覽確認並發布。</desc>

          .step-number{fill:#2d3142;font-size:8px;font-weight:600}.step-label{fill:#4f5d75;font-size:8px;font-weight:500;letter-spacing:.08em}
          .lane-label{fill:#4f5d75;font-size:8px;font-weight:500;letter-spacing:.12em}.role-text{fill:#2d3142;font-size:8px;font-weight:600}

          .chip-text{fill:#fff;font-size:8px;font-weight:700}.focal-text{fill:#eb6c36}.legend-label{fill:#4f5d75;font-size:8px;font-weight:500;letter-spacing:.08em;text-anchor:end}
          .legend-text{fill:#4f5d75;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:8px;font-weight:400}
        </style>

</body>
</html>

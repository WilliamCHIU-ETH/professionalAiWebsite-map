<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醫師自助編輯後台候選架構</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px;background:#f5f5f5;color:#2d3142;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif}main{width:100%;max-width:1280px}.eyebrow{margin-bottom:8px;color:#4f5d75;font:500 12px 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin-bottom:24px;font:400 32px/1.15 'Instrument Serif','Noto Serif TC',serif}svg{display:block;width:100%;min-width:960px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Target architecture · candidate, not locked spec</p>
    <h1>AI 解讀意圖、系統執行結構化修改、醫師確認發布</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="target-editor-architecture-title target-editor-architecture-desc">
      <title id="target-editor-architecture-title">醫師自助編輯後台候選架構</title>
      <desc id="target-editor-architecture-desc">醫師從 Dashboard 以對話或視覺方式提出修改，AI 只產生結構化變更，確定性控制層驗證權限及欄位並更新獨立 Site Project，系統渲染草稿後由醫師預覽確認，再發布可復原版本。</desc>
      <defs>
        <style>
          .zone-label,.tag,.legend-label,.tech{font-family:'Geist Mono','PingFang TC','Noto Sans Mono CJK TC',ui-monospace,monospace}.zone-label{fill:rgba(45,49,66,.56);font-size:12px;font-weight:600;letter-spacing:.14em}.tag{fill:#4f5d75;font-size:8px;font-weight:600;letter-spacing:.08em}.focal-tag{fill:#eb6c36}.name{fill:#2d3142;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:16px;font-weight:600}.sub{fill:#4f5d75;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:12px}.tech{fill:#7a8399;font-size:12px}.legend-label{fill:#4f5d75;font-size:12px;font-weight:500;letter-spacing:.08em}.legend-text{fill:#4f5d75;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:12px}
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="40" y="80" width="300" height="500" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <rect x="64" y="72" width="184" height="20" fill="#f5f5f5"/><text x="72" y="88" class="zone-label">DOCTOR + AI UI</text>
      <rect x="364" y="80" width="520" height="500" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <rect x="388" y="72" width="272" height="20" fill="#f5f5f5"/><text x="396" y="88" class="zone-label">DETERMINISTIC CONTROL PLANE</text>
      <rect x="908" y="80" width="332" height="500" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <rect x="932" y="72" width="240" height="20" fill="#f5f5f5"/><text x="940" y="88" class="zone-label">HUMAN-GATED PUBLISHING</text>

      <!-- Connectors before nodes -->
      <path d="M190 212 V280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M308 320 H336 Q344 320 344 312 V164 Q344 156 352 156 H400" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M624 192 V240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M624 312 V360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M848 396 H888 Q896 396 896 388 V164 Q896 156 904 156 H940" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M1074 212 V280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M1074 352 V420" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Doctor + AI UI -->
      <rect x="72" y="140" width="236" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="84" y="152" width="36" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="102" y="164" class="tag" text-anchor="middle">USER</text>
      <text x="136" y="168" class="name">Doctor Dashboard</text><text x="136" y="188" class="sub">登入、選擇自己的 Site Project</text>

      <rect x="72" y="280" width="236" height="80" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="84" y="292" width="28" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="98" y="304" class="tag" text-anchor="middle">AI</text>
      <text x="128" y="308" class="name">Chat＋Visual Editor</text><text x="128" y="332" class="sub">理解意圖、選取、拖曳、排序</text><text x="128" y="348" class="tech">never writes raw HTML</text>

      <!-- Deterministic control plane -->
      <rect x="400" y="120" width="448" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="412" y="132" width="52" height="16" rx="2" fill="rgba(235,108,54,.16)"/><text x="438" y="144" class="tag focal-tag" text-anchor="middle">CHANGE</text>
      <text x="484" y="148" class="name">Structured Change Request</text><text x="484" y="168" fill="#eb6c36" class="sub">欄位、區塊、Theme、Asset 的明確修改</text>

      <rect x="400" y="240" width="448" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="412" y="252" width="56" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="440" y="264" class="tag" text-anchor="middle">GUARD</text>
      <text x="484" y="268" class="name">Validation／Permission</text><text x="484" y="288" class="sub">驗證登入權限、Schema、允許修改範圍</text>

      <rect x="400" y="360" width="448" height="72" rx="6" fill="rgba(45,49,66,.04)" stroke="#4f5d75"/>
      <rect x="412" y="372" width="52" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="438" y="384" class="tag" text-anchor="middle">STATE</text>
      <text x="484" y="388" class="name">Site Project＋Profile Schema</text><text x="484" y="408" class="sub">獨立 site_id；Content／Layout／Assets</text><text x="484" y="424" class="tech">draft state · version metadata</text>

      <!-- Human-gated publishing -->
      <rect x="940" y="140" width="268" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="952" y="152" width="48" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="976" y="164" class="tag" text-anchor="middle">RENDER</text>
      <text x="1016" y="168" class="name">Draft Renderer</text><text x="1016" y="188" class="sub">依結構化資料產生可預期網站</text>

      <rect x="940" y="280" width="268" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="952" y="292" width="52" height="16" rx="2" fill="rgba(235,108,54,.16)"/><text x="978" y="304" class="tag focal-tag" text-anchor="middle">HUMAN</text>
      <text x="1020" y="308" class="name">Preview＋Confirm</text><text x="1020" y="328" fill="#eb6c36" class="sub">醫師保留發布決定權</text>

      <rect x="940" y="420" width="268" height="72" rx="6" fill="#fff" stroke="#2e5aa8"/>
      <rect x="952" y="432" width="52" height="16" rx="2" fill="rgba(46,90,168,.12)"/><text x="978" y="444" fill="#2e5aa8" class="tag" text-anchor="middle">PUBLIC</text>
      <text x="1020" y="448" class="name">Versioned Publish</text><text x="1020" y="468" class="sub">獨立網址、保存版本、可 rollback</text>

      <!-- Guardrail -->
      <rect x="40" y="608" width="1200" height="56" rx="8" fill="rgba(235,108,54,.04)" stroke="rgba(235,108,54,.28)" stroke-dasharray="4 4"/>
      <text x="64" y="642" class="legend-label" fill="#eb6c36">GUARDRAIL</text><text x="180" y="642" class="legend-text">AI 只解讀需求並產生結構化修改；確定性系統執行；醫師預覽後才發布。</text>

      <line x1="40" y1="688" x2="1240" y2="688" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <text x="40" y="712" class="legend-label">STATUS</text><text x="132" y="712" class="legend-text">候選架構；Chat／Visual 比例、可修改欄位、發布規則與儲存方式仍屬 OPEN。</text>
    </svg>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>professionalAiWebsite 現況技術架構</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px;background:#f5f5f5;color:#2d3142;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif}

<body>
  <main>
    <p class="eyebrow">IT current-state · confirmed implementation</p>
    <h1>現有 repo 如何把 Facebook 頁面變成 Cloud Run 上的固定網站</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="current-repo-architecture-title current-repo-architecture-desc">
      <title id="current-repo-architecture-title">professionalAiWebsite 現況技術架構</title>
      <desc id="current-repo-architecture-desc">目前系統從 Facebook URL 抓取公開資料，以規則整理成共用 profile，再由 B2 或 C2 固定模板產生會被下一次生成覆寫的靜態網站，最後包成 Docker image 部署至 Google Cloud Run。</desc>
      <defs>
        <style>
          .zone-label,.tag,.legend-label,.tech,.arrow-label{font-family:'Geist Mono','PingFang TC','Noto Sans Mono CJK TC',ui-monospace,monospace}.zone-label{fill:rgba(45,49,66,.56);font-size:12px;font-weight:600;letter-spacing:.14em}.node-name{fill:#2d3142;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:16px;font-weight:600}.node-sub{fill:#4f5d75;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:12px}.tech{fill:#7a8399;font-size:12px}.tag{fill:#4f5d75;font-size:8px;font-weight:600;letter-spacing:.08em}.focal-tag{fill:#eb6c36}.legend-label{fill:#4f5d75;font-size:12px;font-weight:500;letter-spacing:.08em}.legend-text{fill:#4f5d75;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:12px}.arrow-label{font-size:8px;font-weight:600;letter-spacing:.06em}
        </style>

        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="40" y="64" width="320" height="448" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <rect x="64" y="56" width="140" height="20" fill="#f5f5f5"/><text x="72" y="72" class="zone-label">INPUT / COLLECT</text>
      <rect x="384" y="64" width="400" height="448" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <rect x="408" y="56" width="128" height="20" fill="#f5f5f5"/><text x="416" y="72" class="zone-label">NORMALIZE</text>

      <path d="M200 192 V248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M328 284 H360 Q368 284 368 276 V164 Q368 156 376 156 H416" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <path d="M1040 320 V376" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M200 448 V496 Q200 504 208 504 H824 Q832 504 832 496 V312 Q832 304 840 304" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <rect x="208" y="332" width="52" height="16" rx="2" fill="#f5f5f5"/><text x="234" y="344" fill="#4f5d75" class="arrow-label" text-anchor="middle">FAIL</text>

      <!-- Zone 1 nodes -->
      <rect x="72" y="120" width="256" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="84" y="132" width="36" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="102" y="144" class="tag" text-anchor="middle">WEB</text>

      <rect x="72" y="248" width="256" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="84" y="260" width="36" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="102" y="272" class="tag" text-anchor="middle">JS</text>
      <text x="136" y="276" class="node-name">公開資料抓取</text><text x="136" y="296" class="node-sub">OG metadata＋Playwright 公開貼文</text><text x="136" y="312" class="tech">scrape.js</text>

      <rect x="72" y="376" width="256" height="72" rx="6" fill="#fff" stroke="#7a8399" stroke-dasharray="4 3"/>
      <rect x="84" y="388" width="52" height="16" rx="2" fill="rgba(45,49,66,.06)"/><text x="110" y="400" class="tag" text-anchor="middle">FALLBACK</text>

      <rect x="416" y="120" width="336" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="428" y="132" width="40" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="448" y="144" class="tag" text-anchor="middle">RAW</text>

      <rect x="416" y="248" width="336" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="428" y="260" width="40" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="448" y="272" class="tag" text-anchor="middle">RULE</text>

      <rect x="416" y="376" width="336" height="72" rx="6" fill="rgba(45,49,66,.04)" stroke="#4f5d75"/>
      <rect x="428" y="388" width="44" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="450" y="400" class="tag" text-anchor="middle">STATE</text>
      <text x="488" y="404" class="node-name">共用 Profile 與素材</text><text x="488" y="424" class="tech">profile.json＋assets</text>

      <!-- Zone 3 nodes -->
      <rect x="840" y="120" width="368" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <rect x="852" y="132" width="44" height="16" rx="2" fill="rgba(45,49,66,.08)"/><text x="874" y="144" class="tag" text-anchor="middle">BUILD</text>

      <rect x="840" y="248" width="368" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="852" y="260" width="44" height="16" rx="2" fill="rgba(235,108,54,.16)"/><text x="874" y="272" class="tag focal-tag" text-anchor="middle">OUTPUT</text>
      <text x="912" y="276" class="node-name">共用靜態網站輸出</text><text x="912" y="296" fill="#eb6c36" class="node-sub">每次生成覆寫 /sites/b2 與 /sites/c2</text>

      <rect x="840" y="376" width="368" height="72" rx="6" fill="#fff" stroke="#2e5aa8" stroke-dasharray="4 3"/>
      <rect x="852" y="388" width="48" height="16" rx="2" fill="rgba(46,90,168,.12)"/><text x="876" y="400" fill="#2e5aa8" class="tag" text-anchor="middle">CLOUD</text>
      <text x="916" y="404" class="node-name">Google Cloud Run</text><text x="916" y="424" class="node-sub">Docker → Artifact Registry → asia-east1</text>

      <!-- Bottom note and legend -->
      <rect x="40" y="544" width="1200" height="72" rx="8" fill="rgba(235,108,54,.04)" stroke="rgba(235,108,54,.28)" stroke-dasharray="4 4"/>
      <text x="64" y="572" fill="#eb6c36" class="legend-label">CURRENT BOTTLENECK</text>
      <text x="64" y="596" class="legend-text">系統能穩定產生展示頁，但沒有 per-doctor site isolation、登入、後台、草稿／發布或版本復原。</text>

      <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <text x="40" y="680" class="legend-label">LEGEND</text>
      <line x1="132" y1="676" x2="172" y2="676" stroke="#4f5d75" marker-end="url(#arrow)"/><text x="184" y="680" class="legend-text">既有 runtime</text>
      <line x1="344" y1="676" x2="384" y2="676" stroke="#4f5d75" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="396" y="680" class="legend-text">fallback</text>
      <line x1="520" y1="676" x2="560" y2="676" stroke="#2e5aa8" marker-end="url(#arrow-link)"/><text x="572" y="680" class="legend-text">外部來源／部署</text>
      <rect x="768" y="664" width="24" height="24" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text x="804" y="680" class="legend-text">共用輸出瓶頸</text>

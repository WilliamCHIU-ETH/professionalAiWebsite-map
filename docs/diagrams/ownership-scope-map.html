<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接手責任範圍</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px;background:#f5f5f5;color:#2d3142;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif}main{width:100%;max-width:1280px}.eyebrow{margin-bottom:8px;color:#4f5d75;font:500 12px 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin-bottom:24px;font:400 32px/1.15 'Instrument Serif','Noto Serif TC',serif}svg{display:block;width:100%;min-width:960px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Ownership tree · current scope</p>
    <h1>接手後的工作分成 Explore、Optimize、Create 三條責任線</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ownership-scope-map-title ownership-scope-map-desc">
      <title id="ownership-scope-map-title">接手責任範圍</title>
      <desc id="ownership-scope-map-desc">本階段責任分成探索編輯與匯入方式、優化資料模板與可靠性、建立 site isolation 及醫師自助 CMS；商業模式、付費意願、曝光成效和其他專業人士不在範圍內。</desc>
      <defs>
        <style>
          .tag,.legend-label{font-family:'Geist Mono','PingFang TC','Noto Sans Mono CJK TC',ui-monospace,monospace}.tag{fill:#4f5d75;font-size:12px;font-weight:600;letter-spacing:.12em}.name{fill:#2d3142;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:16px;font-weight:600}.sub{fill:#4f5d75;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:12px}.tech{fill:#7a8399;font-family:'Geist Mono','PingFang TC','Noto Sans Mono CJK TC',ui-monospace,monospace;font-size:12px}.legend-label{fill:#4f5d75;font-size:12px;font-weight:500;letter-spacing:.08em}.legend-text{fill:#4f5d75;font-family:'Geist','PingFang TC','Noto Sans TC',system-ui,sans-serif;font-size:12px}
        </style>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Connectors before nodes -->
      <path d="M640 136 V176 H240 V224 M640 176 V224 M640 176 H1040 V224" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M240 288 V352 H140 V392 M240 352 H380 V392" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M640 288 V392" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M1040 288 V352 H900 V392 M1040 352 H1140 V392" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Root -->
      <rect x="520" y="72" width="240" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="640" y="100" class="name" text-anchor="middle">我的接手責任</text><text x="640" y="120" fill="#eb6c36" class="sub" text-anchor="middle">從建站 Demo 推進到可維護產品</text>

      <!-- Level 1 -->
      <rect x="120" y="224" width="240" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <text x="240" y="252" class="tag" text-anchor="middle">EXPLORE</text><text x="240" y="272" class="sub" text-anchor="middle">釐清互動方式與修改邊界</text>
      <rect x="520" y="224" width="240" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <text x="640" y="252" class="tag" text-anchor="middle">OPTIMIZE</text><text x="640" y="272" class="sub" text-anchor="middle">修正資料、模板與可靠性</text>
      <rect x="920" y="224" width="240" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.36)"/>
      <text x="1040" y="252" class="tag" text-anchor="middle">CREATE</text><text x="1040" y="272" class="sub" text-anchor="middle">建立可長期維護的平台能力</text>

      <!-- Leaves -->
      <rect x="40" y="392" width="200" height="88" rx="6" fill="rgba(45,49,66,.025)" stroke="rgba(45,49,66,.28)" stroke-width="0.8"/>
      <text x="140" y="420" class="name" text-anchor="middle">編輯體驗</text><text x="140" y="444" class="sub" text-anchor="middle">Chat／Visual／Hybrid</text><text x="140" y="464" class="tech" text-anchor="middle">low-learning-cost UX</text>
      <rect x="280" y="392" width="200" height="88" rx="6" fill="rgba(45,49,66,.025)" stroke="rgba(45,49,66,.28)" stroke-width="0.8"/>
      <text x="380" y="420" class="name" text-anchor="middle">修改與匯入範圍</text><text x="380" y="444" class="sub" text-anchor="middle">內容、版面、專科視覺</text><text x="380" y="464" class="tech" text-anchor="middle">Facebook import options</text>
      <rect x="540" y="392" width="200" height="88" rx="6" fill="rgba(45,49,66,.025)" stroke="rgba(45,49,66,.28)" stroke-width="0.8"/>
      <text x="640" y="420" class="name" text-anchor="middle">資料與模板品質</text><text x="640" y="444" class="sub" text-anchor="middle">Schema、來源、配對、元件化</text><text x="640" y="464" class="tech" text-anchor="middle">QA · accessibility · deploy</text>
      <rect x="800" y="392" width="200" height="88" rx="6" fill="rgba(45,49,66,.025)" stroke="rgba(45,49,66,.28)" stroke-width="0.8"/>
      <text x="900" y="420" class="name" text-anchor="middle">Site isolation</text><text x="900" y="444" class="sub" text-anchor="middle">登入、權限、site_id</text><text x="900" y="464" class="tech" text-anchor="middle">data · assets · URL</text>
      <rect x="1040" y="392" width="200" height="88" rx="6" fill="rgba(45,49,66,.025)" stroke="rgba(45,49,66,.28)" stroke-width="0.8"/>
      <text x="1140" y="420" class="name" text-anchor="middle">CMS 與發布</text><text x="1140" y="444" class="sub" text-anchor="middle">Draft、Preview、Version</text><text x="1140" y="464" class="tech" text-anchor="middle">AI-assisted editing</text>

      <!-- Out-of-scope boundary -->
      <rect x="40" y="544" width="1200" height="88" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.22)" stroke-dasharray="4 4"/>
      <text x="64" y="576" class="legend-label">OUT OF SCOPE</text>
      <text x="64" y="608" class="legend-text">商業模式與定價</text><circle cx="224" cy="604" r="2" fill="#7a8399"/>
      <text x="248" y="608" class="legend-text">醫師付費意願</text><circle cx="400" cy="604" r="2" fill="#7a8399"/>
      <text x="424" y="608" class="legend-text">曝光或病患成效</text><circle cx="600" cy="604" r="2" fill="#7a8399"/>
      <text x="624" y="608" class="legend-text">擴展至其他專業人士</text>

      <line x1="40" y1="668" x2="1240" y2="668" stroke="rgba(45,49,66,.12)" stroke-width="0.8"/>
      <text x="40" y="696" class="legend-label">READING</text><text x="132" y="696" class="legend-text">上層是責任類型；下層是可交付的工作群；虛線區域不是本階段驗收內容。</text>
    </svg>
  </main>
</body>
</html>
